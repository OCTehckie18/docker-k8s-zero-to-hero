<title id="t">Life before and after version control</title><desc id="d">Without version control a folder fills with resume_final, resume_final_v2, resume_FINAL_really files and nobody knows which was sent, what changed or how to go back. With Git there is one resume and a history of commits with IDs, messages, authors and months.</desc>
