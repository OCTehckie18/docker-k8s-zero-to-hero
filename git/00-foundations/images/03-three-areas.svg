<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
<title id="t">Working directory, staging area and repository</title><desc id="d">Analogy: a group photo where people move around, you choose who is in the frame, then click and save it to the album. In Git: edits in the working directory are staged with git add and saved as a commit in the repository with git commit; git restore --staged un-stages; git status shows each area.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="470" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">The three areas: edit → stage → commit</tspan></text>
<text x="40" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#a85a00" text-anchor="start"><tspan x="40" dy="0.0">📸 Like taking a group photo</tspan></text>
<rect x="40" y="92" width="280" height="74" rx="12" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="180" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="180" dy="0.0">1 · Everyone moving around</tspan></text><text x="180" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="180" dy="0.0">your edits: messy, not saved</tspan></text>
<rect x="360" y="92" width="280" height="74" rx="12" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="500" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="500" dy="0.0">2 · Choose who's in the frame</tspan></text><text x="500" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">pick what goes in the photo</tspan></text>
<rect x="680" y="92" width="280" height="74" rx="12" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="820" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="820" dy="0.0">3 · Click! Into the album</tspan></text><text x="820" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="820" dy="0.0">saved forever, with a caption</tspan></text>
<text x="40" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b3d91" text-anchor="start"><tspan x="40" dy="0.0">⚙️ In Git</tspan></text>
<rect x="40" y="214" width="280" height="124" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="180" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="180" dy="0.0">📂 Working directory</tspan></text><text x="180" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="180" dy="0.0">the files you edit</tspan><tspan x="180" dy="16.9">menu.md  (modified)</tspan></text>
<rect x="360" y="214" width="280" height="124" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="500" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">📋 Staging area</tspan></text><text x="500" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="500" dy="0.0">what goes in the</tspan><tspan x="500" dy="16.9">next commit</tspan><tspan x="500" dy="16.9">menu.md  (staged)</tspan></text>
<rect x="680" y="214" width="280" height="124" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="820" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="820" dy="0.0">🗄️ Repository (.git)</tspan></text><text x="820" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="820" dy="0.0">every commit, forever</tspan><tspan x="820" dy="16.9">c94e1aa Raise dosa price</tspan></text>
<path d="M322,262 L358,262" fill="none" stroke="#1d63ed" stroke-width="2.6" marker-end="url(#ah-blue)"/><rect x="310" y="240" width="60" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="340" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1d63ed" text-anchor="middle"><tspan x="340" dy="0.0">git add</tspan></text>
<path d="M642,262 L678,262" fill="none" stroke="#1d63ed" stroke-width="2.6" marker-end="url(#ah-blue)"/><rect x="619" y="240" width="82" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="660" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1d63ed" text-anchor="middle"><tspan x="660" dy="0.0">git commit</tspan></text>
<path d="M498,342 Q340,386 182,342" fill="none" stroke="#55637a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah-muted)"/><rect x="266" y="368" width="148" height="19" fill="#ffffff" opacity="0.92" rx="4"/><text x="340" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#55637a" text-anchor="middle"><tspan x="340" dy="0.0">git restore --staged</tspan></text>
<rect x="40" y="402" width="920" height="54" rx="27" fill="#ffffff" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="500" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#15803d" text-anchor="middle"><tspan x="500" dy="0.0">💡 git status shows what is in each area. Run it all the time: it's free and always tells you what to do next.</tspan></text>
</svg>
