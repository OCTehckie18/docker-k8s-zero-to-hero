<title id="t">Git in the end-to-end delivery pipeline</title><desc id="d">Commit, pull request, CI build and test, Docker image, registry, Kubernetes deploy, feedback. Bands mark Track 0 Git, CI, Track 1 Docker and Track 2 Kubernetes. A tag v1.4.2 becomes image shop:1.4.2, rolled out by Kubernetes.</desc>
