<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
<title id="t">Choosing the right Git undo command</title><desc id="d">Seven situations and commands: git restore for unwanted edits, git restore --staged to unstage, git commit --amend for the last local commit, git revert for pushed commits, git stash to set work aside, git reset --hard to discard local commits (destructive), and git reflog to rescue lost commits. Golden rule: never rewrite pushed history.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="540" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">Oops! Which undo do I need?</tspan></text>
<rect x="30" y="72" width="940" height="48" rx="10" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="48" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="48" dy="0.0">I edited a file and want the last committed version back</tspan></text>
<rect x="500" y="80" width="290" height="32" rx="8" fill="#f4f6f9" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/><text x="512" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b3d91" text-anchor="start"><tspan x="512" dy="0.0">git restore menu.md</tspan></text>
<rect x="808" y="81" width="148" height="30" rx="15" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="882" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="882" dy="0.0">⚠️ edits are lost</tspan></text>
<rect x="30" y="128" width="940" height="48" rx="10" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="48" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="48" dy="0.0">I staged a file by mistake</tspan></text>
<rect x="500" y="136" width="290" height="32" rx="8" fill="#f4f6f9" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/><text x="512" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b3d91" text-anchor="start"><tspan x="512" dy="0.0">git restore --staged menu.md</tspan></text>
<rect x="808" y="137" width="148" height="30" rx="15" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="882" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="882" dy="0.0">✅ safe</tspan></text>
<rect x="30" y="184" width="940" height="48" rx="10" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="48" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="48" dy="0.0">Wrong message, or I forgot a file (not pushed)</tspan></text>
<rect x="500" y="192" width="290" height="32" rx="8" fill="#f4f6f9" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/><text x="512" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b3d91" text-anchor="start"><tspan x="512" dy="0.0">git commit --amend</tspan></text>
<rect x="808" y="193" width="148" height="30" rx="15" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="882" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="882" dy="0.0">✅ safe locally</tspan></text>
<rect x="30" y="240" width="940" height="48" rx="10" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="48" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="48" dy="0.0">Undo a commit that's already pushed</tspan></text>
<rect x="500" y="248" width="290" height="32" rx="8" fill="#f4f6f9" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/><text x="512" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b3d91" text-anchor="start"><tspan x="512" dy="0.0">git revert &lt;commit&gt;</tspan></text>
<rect x="808" y="249" width="148" height="30" rx="15" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="882" y="269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="882" dy="0.0">✅ team-safe</tspan></text>
<rect x="30" y="296" width="940" height="48" rx="10" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="48" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="48" dy="0.0">Put unfinished work aside for a moment</tspan></text>
<rect x="500" y="304" width="290" height="32" rx="8" fill="#f4f6f9" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/><text x="512" y="325" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b3d91" text-anchor="start"><tspan x="512" dy="0.0">git stash  /  git stash pop</tspan></text>
<rect x="808" y="305" width="148" height="30" rx="15" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="882" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="882" dy="0.0">✅ safe</tspan></text>
<rect x="30" y="352" width="940" height="48" rx="10" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="48" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="48" dy="0.0">Throw away my last local commit completely</tspan></text>
<rect x="500" y="360" width="290" height="32" rx="8" fill="#f4f6f9" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/><text x="512" y="381" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b3d91" text-anchor="start"><tspan x="512" dy="0.0">git reset --hard HEAD~1</tspan></text>
<rect x="808" y="361" width="148" height="30" rx="15" fill="#fdeeee" stroke="#c62828" stroke-width="1.6" opacity="1"/><text x="882" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#c62828" text-anchor="middle"><tspan x="882" dy="0.0">🛑 destructive</tspan></text>
<rect x="30" y="408" width="940" height="48" rx="10" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="48" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="48" dy="0.0">Help! I lost commits (reset, deleted branch)</tspan></text>
<rect x="500" y="416" width="290" height="32" rx="8" fill="#f4f6f9" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/><text x="512" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b3d91" text-anchor="start"><tspan x="512" dy="0.0">git reflog</tspan></text>
<rect x="808" y="417" width="148" height="30" rx="15" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="882" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d63ed" text-anchor="middle"><tspan x="882" dy="0.0">🛟 the rescue</tspan></text>
<rect x="30" y="474" width="940" height="50" rx="25" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="500" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="500" dy="0.0">🧠 Golden rule: never rewrite history your team already has. Pushed? Use git revert, not reset.</tspan></text>
</svg>
