<rect x="30" y="70" width="940" height="122" rx="14" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="50" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#a85a00" text-anchor="start"><tspan x="50" dy="0.0">🎮 Like save points in a video game</tspan></text>
