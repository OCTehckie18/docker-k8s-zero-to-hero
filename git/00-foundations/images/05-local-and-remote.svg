<path d="M770,298 L612,188" fill="none" stroke="#1d63ed" stroke-width="2.4" marker-end="url(#ah-blue)"/><rect x="594" y="257" width="72" height="21" fill="#ffffff" opacity="0.92" rx="4"/><text x="630" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1d63ed" text-anchor="middle"><tspan x="630" dy="0.0">git push</tspan></text>
<rect x="350" y="300" width="300" height="100" rx="12" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="500" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="500" dy="0.0">📒 Analogy</tspan></text>
<text x="500" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">Everyone owns a complete copy of the</tspan><tspan x="500" dy="16.2">notebook. GitHub is the copy in the</tspan><tspan x="500" dy="16.2">office that everyone syncs with.</tspan></text>
<text x="500" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#55637a" text-anchor="middle"><tspan x="500" dy="0.0">Git = the tool on every laptop  ·  GitHub / GitLab / Bitbucket = websites that host the shared copy, plus teamwork features</tspan></text>
</svg>
