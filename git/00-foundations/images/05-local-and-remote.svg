<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d">
<title id="t">Local repositories and the shared remote</title><desc id="d">Your laptop and Lakshmi's laptop each hold a full repository. GitHub, called origin, holds the shared copy. git push sends commits up, git pull brings them down, git clone makes the first copy. Analogy: everyone owns a complete notebook and syncs with the office copy.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="460" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">Local and remote: everyone has the full history</tspan></text>
<rect x="370" y="74" width="260" height="112" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="500.0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">☁️ GitHub  (“origin”)</tspan></text><text x="500.0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="500.0" dy="0.0">the team's shared copy</tspan><tspan x="500.0" dy="16.9">+ pull requests, reviews, CI</tspan></text>
<rect x="50" y="300" width="270" height="100" rx="12" fill="#ffffff" stroke="#0f1f3d" stroke-width="1.6" opacity="1"/><text x="185.0" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="185.0" dy="0.0">💻 Your laptop</tspan></text><text x="185.0" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="185.0" dy="0.0">full repo + full history</tspan><tspan x="185.0" dy="16.9">work offline, commit anytime</tspan></text>
<rect x="680" y="300" width="270" height="100" rx="12" fill="#ffffff" stroke="#0f1f3d" stroke-width="1.6" opacity="1"/><text x="815.0" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="815.0" dy="0.0">💻 Lakshmi's laptop</tspan></text><text x="815.0" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="815.0" dy="0.0">her own full copy</tspan><tspan x="815.0" dy="16.9">+ her own branches</tspan></text>
