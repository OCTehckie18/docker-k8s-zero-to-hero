<rect x="504" y="252" width="225" height="82" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="616" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="616" dy="0.0">🧾 Traceability</tspan></text><text x="616" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="616" dy="0.0">who changed what,</tspan><tspan x="616" dy="16.2">when, and why</tspan></text>
<rect x="741" y="252" width="225" height="82" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="853" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="853" dy="0.0">🔒 Controlled release</tspan></text><text x="853" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="853" dy="0.0">main is protected:</tspan><tspan x="853" dy="16.2">no direct pushes</tspan></text>
<rect x="30" y="352" width="940" height="86" rx="14" fill="#fdeeee" stroke="#c62828" stroke-width="1.6" opacity="1"/>
<text x="500" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#c62828" text-anchor="middle"><tspan x="500" dy="0.0">⚠️ A successful commit is not the same as a safe production release.</tspan></text>
<text x="500" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">Skipping review and checks invites regressions, security holes, broken features and unhappy customers.</tspan></text>
