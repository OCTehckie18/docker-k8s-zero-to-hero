<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 455" width="1000" height="455" role="img" aria-labelledby="t d">
<title id="t">The GitHub flow used by most teams</title><desc id="d">Eight steps: task, branch, commit, push, pull request, review plus CI, merge into protected main, deploy. Why: code review, automated checks, traceability and controlled release. Warning: a successful commit is not a safe production release.</desc>
