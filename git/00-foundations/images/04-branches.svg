<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" width="1000" height="475" role="img" aria-labelledby="t d">
<title id="t">Branches and HEAD</title><desc id="d">Main line of commits C1 to C5 with a feature branch add-cold-brew splitting off at C3 with commits F1 and F2 and merging back in merge commit M. Branch labels are sticky notes; HEAD marks you are here on main.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="475" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">Branches: a sticky note that moves with your work</tspan></text>
<line x1="90" y1="250" x2="860" y2="250" stroke="#1d63ed" stroke-width="4"/>
<path d="M330,250 C380,250 380,140 440,140 L600,140 C660,140 660,250 720,250" fill="none" stroke="#15803d" stroke-width="4"/>
<circle cx="90" cy="250" r="15" fill="#ffffff" stroke="#1d63ed" stroke-width="3.5"/><text x="90" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="90" dy="0.0">C1</tspan></text><text x="90" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="90" dy="0.0">Add menu</tspan></text>
<circle cx="210" cy="250" r="15" fill="#ffffff" stroke="#1d63ed" stroke-width="3.5"/><text x="210" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="210" dy="0.0">C2</tspan></text><text x="210" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="210" dy="0.0">Add hours</tspan></text>
<circle cx="330" cy="250" r="15" fill="#ffffff" stroke="#1d63ed" stroke-width="3.5"/><text x="330" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="330" dy="0.0">C3</tspan></text><text x="330" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="330" dy="0.0">New prices</tspan></text>
<circle cx="520" cy="250" r="15" fill="#ffffff" stroke="#1d63ed" stroke-width="3.5"/><text x="520" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="520" dy="0.0">C4</tspan></text><text x="520" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="520" dy="0.0">Fix typo</tspan></text>
<circle cx="720" cy="250" r="15" fill="#ffffff" stroke="#1d63ed" stroke-width="3.5"/><text x="720" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="720" dy="0.0">M</tspan></text><text x="720" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="720" dy="0.0">Merge cold brew</tspan></text>
<circle cx="860" cy="250" r="15" fill="#ffffff" stroke="#1d63ed" stroke-width="3.5"/><text x="860" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="860" dy="0.0">C5</tspan></text><text x="860" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="860" dy="0.0">Add photos</tspan></text>
<circle cx="460" cy="140" r="15" fill="#ffffff" stroke="#15803d" stroke-width="3.5"/><text x="460" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#15803d" text-anchor="middle"><tspan x="460" dy="0.0">F1</tspan></text><text x="460" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="460" dy="0.0">Add cold brew</tspan></text>
<circle cx="590" cy="140" r="15" fill="#ffffff" stroke="#15803d" stroke-width="3.5"/><text x="590" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#15803d" text-anchor="middle"><tspan x="590" dy="0.0">F2</tspan></text><text x="590" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="590" dy="0.0">Price cold brew</tspan></text>
<rect x="530" y="160" width="150" height="26" rx="13" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="605" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="605" dy="0.0">🏷️ add-cold-brew</tspan></text>
<rect x="810" y="302" width="110" height="26" rx="13" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="865" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="865" dy="0.0">🏷️ main</tspan></text>
<rect x="780" y="196" width="170" height="26" rx="13" fill="#fdeeee" stroke="#c62828" stroke-width="1.6" opacity="1"/><text x="865" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c62828" text-anchor="middle"><tspan x="865" dy="0.0">📍 HEAD: you are here</tspan></text>
<path d="M865,224 L865,236" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#ah-red)"/>
<rect x="345" y="194" width="100" height="19" fill="#ffffff" opacity="0.92" rx="4"/><text x="395" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="395" dy="0.0">git switch -c</tspan></text><rect x="632" y="194" width="72" height="19" fill="#ffffff" opacity="0.92" rx="4"/><text x="668" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="668" dy="0.0">git merge</tspan></text>
<rect x="30" y="348" width="455" height="112" rx="14" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="257" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="257" dy="0.0">🏷️ A branch is a sticky note</tspan></text>
<text x="257" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="257" dy="0.0">It marks one commit and moves forward each</tspan><tspan x="257" dy="17.6">time you commit on it. Creating one is instant,</tspan><tspan x="257" dy="17.6">so experiment freely: main stays safe.</tspan></text>
<rect x="515" y="348" width="455" height="112" rx="14" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="742" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="742" dy="0.0">📍 HEAD = “you are here”</tspan></text>
<text x="742" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="742" dy="0.0">The branch you are on right now.</tspan><tspan x="742" dy="17.6">git switch moves you between branches;</tspan><tspan x="742" dy="17.6">your files change to match.</tspan></text>
</svg>
