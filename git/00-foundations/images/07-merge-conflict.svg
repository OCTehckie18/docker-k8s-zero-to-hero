<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
<title id="t">How a merge conflict happens</title><desc id="d">The cappuccino line is ₹150 on main; you change it to ₹160 on one branch and Asha to ₹180 on another. Merging produces conflict markers showing both versions; you choose the final line, then git add and git commit. Different lines merge automatically; the same line needs a human.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="470" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">Merge conflicts: when two people change the same line</tspan></text>
<rect x="40" y="160" width="230" height="92" rx="12" fill="#ffffff" stroke="#0f1f3d" stroke-width="1.6" opacity="1"/><text x="155.0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="155.0" dy="0.0">📄 menu.md on main</tspan></text><text x="155.0" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="155.0" dy="0.0">| Cappuccino | ₹150 |</tspan></text>
<rect x="330" y="82" width="250" height="92" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="455.0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="455.0" dy="0.0">🧑 You (branch: price-update)</tspan></text><text x="455.0" y="127.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="455.0" dy="0.0">| Cappuccino | ₹160 |</tspan></text>
<rect x="330" y="240" width="250" height="92" rx="12" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="455.0" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="455.0" dy="0.0">👩 Asha (branch: premium)</tspan></text><text x="455.0" y="285.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="455.0" dy="0.0">| Cappuccino | ₹180 |</tspan></text>
<path d="M272,190 L326,130" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/><path d="M272,222 L326,284" fill="none" stroke="#15803d" stroke-width="2.2" marker-end="url(#ah-green)"/>
<rect x="640" y="82" width="320" height="250" rx="12" fill="#fdeeee" stroke="#c62828" stroke-width="1.6" opacity="1"/><text x="800" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c62828" text-anchor="middle"><tspan x="800" dy="0.0">💥 git merge premium → CONFLICT</tspan></text>
<text x="660" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="start"><tspan x="660" dy="0.0">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</tspan><tspan x="660" dy="20.9">| Cappuccino | ₹160 |</tspan><tspan x="660" dy="20.9">=======</tspan><tspan x="660" dy="20.9">| Cappuccino | ₹180 |</tspan><tspan x="660" dy="20.9">&gt;&gt;&gt;&gt;&gt;&gt;&gt; premium</tspan></text>
<text x="800" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="800" dy="0.0">Git marks both versions in the file</tspan></text>
<path d="M582,128 L636,150" fill="none" stroke="#1d63ed" stroke-width="1.8" marker-end="url(#ah-blue)"/><path d="M582,286 L636,270" fill="none" stroke="#15803d" stroke-width="1.8" marker-end="url(#ah-green)"/>
<rect x="40" y="352" width="920" height="50" rx="25" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="500" y="383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="500" dy="0.0">✅ You decide: keep | Cappuccino | ₹170 |, delete the markers, then git add menu.md and git commit</tspan></text>
<text x="500" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">Different lines? Git merges automatically. Same line? Git stops and asks a human. It never guesses.</tspan></text>
<text x="500" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a85a00" text-anchor="middle" font-style="italic"><tspan x="500" dy="0.0">📝 Like two editors rewriting the same sentence: the editor-in-chief has to pick.</tspan></text>
</svg>
