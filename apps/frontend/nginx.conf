# The frontend tier: an NGINX reverse proxy in front of the API.
# "api" is resolved by Docker's embedded DNS (Compose) or Kubernetes DNS (a Service named "api").
server {
    listen 8080;
    server_name _;

    # Tell the browser which frontend container/pod proxied the request (shown in the UI).
    add_header X-Frontend $hostname always;

    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 70s;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
