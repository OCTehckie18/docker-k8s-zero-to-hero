ll="#55637a" text-anchor="middle"><tspan x="204" dy="0.0">real OS-level</tspan><tspan x="204" dy="15.4">isolation</tspan></text><circle cx="204" cy="240" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="303" y1="240" x2="303" y2="214" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="215.0" y="112" width="176" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="303" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="303" dy="0.0">2004</tspan></text><text x="303" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="303" dy="0.0">Solaris Zones</tspan></text><text x="303" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="303" dy="0.0">isolated OS</tspan><tspan x="303" dy="15.4">environments</tspan></text><circle cx="303" cy="240" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="402" y1="240" x2="402" y2="266" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="314.0" y="266" width="176" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="402" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="402" dy="0.0">2008</tspan></text><text x="402" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="402" dy="0.0">cgroups + LXC</tspan></text><text x="402" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="402" dy="0.0">Linux resource limits</tspan><tspan x="402" dy="15.4">+ Linux containers</tspan></text><circle cx="402" cy="240" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="501" y1="240" x2="501" y2="214" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="413.0" y="112" width="176" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="501" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="501" dy="0.0">2013</tspan></text><text x="501" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="501" dy="0.0">Docker launches</tspan></text><text x="501" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="501" dy="0.0">dotCloud's PyCon demo:</tspan><tspan x="501" dy="15.4">containers made easy</tspan></text><circle cx="501" cy="240" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="600" y1="240" x2="600" y2="266" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="512.0" y="266" width="176" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="600" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="600" dy="0.0">2014</tspan></text><text x="600" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="600" dy="0.0">Docker Hub + K8s</tspan></text><text x="600" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="600" dy="0.0">share images; Google</tspan><tspan x="600" dy="15.4">open-sources Kubernetes</tspan></text><circle cx="600" cy="240" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="699" y1="240" x2="699" y2="214" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="611.0" y="112" width="176" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="699" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="699" dy="0.0">2015</tspan></text><text x="699" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="699" dy="0.0">OCI · runc · CNCF</tspan></text><text x="699" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="699" dy="0.0">open standards for</tspan><tspan x="699" dy="15.4">images and runtimes</tspan></text><circle cx="699" cy="240" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="798" y1="240" x2="798" y2="266" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="710.0" y="266" width="176" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="798" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="798" dy="0.0">2017</tspan></text><text x="798" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="798" dy="0.0">containerd → CNCF</tspan></text><text x="798" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="798" dy="0.0">Docker's runtime core</tspan><tspan x="798" dy="15.4">becomes community-run</tspan></text><circle cx="798" cy="240" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="897" y1="240" x2="897" y2="214" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="809.0" y="112" width="176" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="897" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="897" dy="0.0">2022</tspan></text><text x="897" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="897" dy="0.0">K8s drops dockershim</tspan></text><text x="897" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="897" dy="0.0">talks to containerd</tspan><tspan x="897" dy="15.4">directly; images still run</tspan></text><circle cx="897" cy="240" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/>
