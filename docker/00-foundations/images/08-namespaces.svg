<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" width="1000" height="558" role="img" aria-labelledby="t d">
<title id="t">Linux namespaces isolate what a container can see</title><desc id="d">Two containers on one kernel each see their own PID 1, network interface, filesystem, hostname, IPC and users; the host sees them as ordinary processes. Analogy: apartments with their own door number, mailbox, rooms, name on the bell, notes and keys.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="558" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">Namespaces: every container gets its own view of the world</tspan></text>
<rect x="30" y="70" width="615" height="450" rx="14" fill="#f4f6f9" stroke="#55637a" stroke-width="1.6" opacity="1"/><text x="337" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="337" dy="0.0">🐧 One Linux host, one kernel</tspan></text>
<rect x="50" y="115" width="280" height="250" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="190" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d63ed" text-anchor="middle"><tspan x="190" dy="0.0">📦 container: web</tspan></text>
<text x="64" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="start"><tspan x="64" dy="0.0">PID  → nginx is PID 1</tspan><tspan x="64" dy="26.9">NET  → eth0 172.17.0.2</tspan><tspan x="64" dy="26.9">MNT  → its own / (alpine)</tspan><tspan x="64" dy="26.9">UTS  → hostname: web</tspan><tspan x="64" dy="26.9">IPC  → private shared memory</tspan><tspan x="64" dy="26.9">USER → container root ≠ host root*</tspan></text>
<rect x="347" y="115" width="280" height="250" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="487" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d63ed" text-anchor="middle"><tspan x="487" dy="0.0">📦 container: db</tspan></text>
<text x="361" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="start"><tspan x="361" dy="0.0">PID  → redis is PID 1</tspan><tspan x="361" dy="26.9">NET  → eth0 172.17.0.3</tspan><tspan x="361" dy="26.9">MNT  → its own / (debian)</tspan><tspan x="361" dy="26.9">UTS  → hostname: db</tspan><tspan x="361" dy="26.9">IPC  → private shared memory</tspan><tspan x="361" dy="26.9">USER → mapped to a normal user*</tspan></text>
<rect x="50" y="385" width="577" height="115" rx="10" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="338" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="338" dy="0.0">What the host sees with ps aux:</tspan></text>
<text x="338" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="338" dy="0.0">PID 4211  nginx: master process</tspan><tspan x="338" dy="18.8">PID 4302  redis-server *:6379</tspan></text>
<text x="338" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b3d91" text-anchor="middle" font-style="italic"><tspan x="338" dy="0.0">Just ordinary processes, wearing blinkers.</tspan></text>
<rect x="665" y="70" width="305" height="270" rx="14" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="817" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="817" dy="0.0">🏢 Analogy: apartments</tspan></text>
<text x="685" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f1f3d" text-anchor="start"><tspan x="685" dy="0.0">🚪 own door number   → PID</tspan><tspan x="685" dy="26.3">📬 own mailbox, address → NET</tspan><tspan x="685" dy="26.3">🛋️ own rooms, furniture → MNT</tspan><tspan x="685" dy="26.3">🔔 own name on the bell → UTS</tspan><tspan x="685" dy="26.3">📝 own private notes  → IPC</tspan><tspan x="685" dy="26.3">🔑 own set of keys    → USER</tspan></text>
<rect x="665" y="355" width="305" height="165" rx="14" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="817" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="817" dy="0.0">Key idea</tspan></text>
<text x="817" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="817" dy="0.0">Namespaces limit what a</tspan><tspan x="817" dy="18.9">process can SEE.</tspan><tspan x="817" dy="18.9">cgroups limit what it</tspan><tspan x="817" dy="18.9">can USE (next diagram).</tspan></text>
<text x="500" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="500" dy="0.0">* With rootless Docker or user-namespace remapping, “root” inside the container is an unprivileged user on the host.</tspan></text>
</svg>
