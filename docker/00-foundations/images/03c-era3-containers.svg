<title id="t">Era 3: containers</title><desc id="d">Analogy: the same plot holds one apartment building with six private flats sharing one foundation, water main and power supply. Technical: hardware, a host OS with one shared Linux kernel, a container runtime, and six containers each holding only an app and its libraries.</desc>
