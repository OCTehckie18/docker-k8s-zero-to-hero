<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" width="1000" height="505" role="img" aria-labelledby="t d">
<title id="t">cgroups limit resources per container</title><desc id="d">Analogy: household quotas, water equals memory (cut off when exceeded), power equals CPU (dimmed). Three containers: web within budget, report exceeds memory and is OOM killed with exit 137, batch hits its CPU limit and is throttled.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="505" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">cgroups: every container gets a budget</tspan></text>
<rect x="30" y="70" width="300" height="400" rx="14" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="180" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="180" dy="0.0">🏠 Analogy: a household budget</tspan></text>
<text x="50" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f1f3d" text-anchor="start"><tspan x="50" dy="0.0">Each flat gets a monthly quota</tspan><tspan x="50" dy="20.3">of water and electricity.</tspan><tspan x="50" dy="20.3"></tspan><tspan x="50" dy="20.3">💧 Use too much water:</tspan><tspan x="50" dy="20.3">    the supply is cut off.</tspan><tspan x="50" dy="20.3"></tspan><tspan x="50" dy="20.3">⚡ Use too much power:</tspan><tspan x="50" dy="20.3">    the lights get dimmer,</tspan><tspan x="50" dy="20.3">    nothing is cut off.</tspan></text>
<text x="50" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b3d91" text-anchor="start"><tspan x="50" dy="0.0">💧 water = memory (hard limit)</tspan><tspan x="50" dy="22.4">⚡ power = CPU (throttled)</tspan></text>
<text x="655" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="655" dy="0.0">🖥️ Host: 4 CPUs · 8 GB RAM, shared by all containers</tspan></text>
