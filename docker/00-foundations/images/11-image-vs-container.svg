<path d="M262,195 L336,195" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/><rect x="254" y="171" width="91" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="299" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d63ed" text-anchor="middle"><tspan x="299" dy="0.0">docker build</tspan></text>
<rect x="340" y="100" width="230" height="190" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="455" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="455" dy="0.0">🎂 Image</tspan></text><text x="455" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b3d91" text-anchor="middle"><tspan x="455" dy="0.0">the baked cake (read-only)</tspan></text>
<text x="455" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="455" dy="0.0">mysite:1.0</tspan><tspan x="455" dy="19.5">sha256:3f9c…e21a</tspan><tspan x="455" dy="19.5">never changes</tspan></text>
