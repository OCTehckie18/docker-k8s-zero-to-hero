<rect x="672" y="236" width="290" height="56" rx="10" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="690" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="start"><tspan x="690" dy="0.0">🍰 web-3</tspan></text><text x="945" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#55637a" text-anchor="end"><tspan x="945" dy="0.0">:8083 · Exited</tspan></text>
<rect x="571" y="148" width="97" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="620" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="620" dy="0.0">docker run ×3</tspan></text>
<rect x="40" y="320" width="920" height="112" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="500" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="500" dy="0.0">One image → many containers. Each container gets its own writable layer.</tspan></text>
<text x="500" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">Changing a running container never changes the image. Want a change to stick? Edit the Dockerfile and rebuild.</tspan><tspan x="500" dy="20.2">Unlike a real cake, the image is never used up: it can serve unlimited slices.</tspan></text>
</svg>
