<title id="t">Era 2: virtual machines</title><desc id="d">Analogy: the same plot holds several complete houses, each with its own foundation, kitchen, water tank and meter, run by a plot manager. Technical: one server's hardware, a hypervisor, and three VMs each containing a full guest OS with its own kernel, libraries and an app.</desc>
