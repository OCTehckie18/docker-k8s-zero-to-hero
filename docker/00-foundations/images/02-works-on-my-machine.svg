<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" width="1000" height="555" role="img" aria-labelledby="t d">
<title id="t">The works-on-my-machine problem</title><desc id="d">Three machines with different Python, Flask, libssl versions and settings give three different results. One container image carrying its runtime behaves the same on all three.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="555" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">“It works on my machine!”</tspan></text>
<rect x="30" y="70" width="290" height="236" rx="12" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="175" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="175" dy="0.0">💻 Developer laptop</tspan></text>
<text x="175" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="175" dy="0.0">Python 3.11  ✔</tspan></text>
<text x="175" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="175" dy="0.0">Flask 3.0  ✔</tspan></text>
<text x="175" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="175" dy="0.0">libssl 3  ✔</tspan></text>
<text x="175" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="175" dy="0.0">DB_URL = set  ✔</tspan></text>
<rect x="75" y="245" width="200" height="40" rx="20" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/>
<text x="175" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="175" dy="0.0">✅ Works!</tspan></text>
<text x="175" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f1f3d" text-anchor="middle" font-style="italic"><tspan x="175" dy="0.0">“Works perfectly on my laptop!”</tspan></text>
<rect x="355" y="70" width="290" height="236" rx="12" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="500" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">🧪 Tester's machine</tspan></text>
<text x="500" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#c62828" text-anchor="middle"><tspan x="500" dy="0.0">Python 3.10  ✘</tspan></text>
<text x="500" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#c62828" text-anchor="middle"><tspan x="500" dy="0.0">Flask 2.2  ✘</tspan></text>
<text x="500" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="500" dy="0.0">libssl 3  ✔</tspan></text>
<text x="500" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="500" dy="0.0">DB_URL = set  ✔</tspan></text>
<rect x="400" y="245" width="200" height="40" rx="20" fill="#fff6e5" stroke="#a85a00" stroke-width="1.6" opacity="1"/>
<text x="500" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="500" dy="0.0">⚠️ Crashes on login</tspan></text>
<text x="500" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f1f3d" text-anchor="middle" font-style="italic"><tspan x="500" dy="0.0">“It crashes on mine.”</tspan></text>
<rect x="680" y="70" width="290" height="236" rx="12" fill="#ffffff" stroke="#c4cfdd" stroke-width="1.6" opacity="1"/>
<text x="825" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="825" dy="0.0">🏭 Production server</tspan></text>
<text x="825" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#c62828" text-anchor="middle"><tspan x="825" dy="0.0">Python 3.9  ✘</tspan></text>
<text x="825" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#c62828" text-anchor="middle"><tspan x="825" dy="0.0">Flask 2.0  ✘</tspan></text>
<text x="825" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#c62828" text-anchor="middle"><tspan x="825" dy="0.0">libssl 1.1  ✘</tspan></text>
<text x="825" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#c62828" text-anchor="middle"><tspan x="825" dy="0.0">DB_URL missing  ✘</tspan></text>
<rect x="725" y="245" width="200" height="40" rx="20" fill="#fdeeee" stroke="#c62828" stroke-width="1.6" opacity="1"/>
<text x="825" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#c62828" text-anchor="middle"><tspan x="825" dy="0.0">❌ Won't even start</tspan></text>
<text x="825" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f1f3d" text-anchor="middle" font-style="italic"><tspan x="825" dy="0.0">“It doesn't even start here!”</tspan></text>
<rect x="30" y="355" width="940" height="160" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<rect x="55" y="375" width="310" height="120" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="210" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="210" dy="0.0">📦 One container image</tspan></text>
<text x="210" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="210" dy="0.0">app code</tspan><tspan x="210" dy="18.2">Python 3.11 + Flask 3.0</tspan><tspan x="210" dy="18.2">libssl 3 + everything else</tspan></text>
