<path d="M365,435 L555,481" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="560" y="464" width="385" height="34" rx="17" fill="#ffffff" stroke="#15803d" stroke-width="1.6" opacity="1"/>
<text x="578" y="487" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="578" dy="0.0">🏭 Production server</tspan></text><text x="925" y="487" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="end"><tspan x="925" dy="0.0">✅ same behaviour</tspan></text>
<text x="500" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="500" dy="0.0">Settings such as DB_URL are still supplied per environment (env vars, secrets). The image itself stays identical.</tspan></text>
</svg>
