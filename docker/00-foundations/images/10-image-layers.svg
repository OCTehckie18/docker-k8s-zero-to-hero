<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535" width="1000" height="535" role="img" aria-labelledby="t d">
<title id="t">Docker image layers and copy-on-write</title><desc id="d">Four read-only image layers from FROM to COPY, topped by a thin writable container layer; a file edited in the container is copied up to the writable layer. Two containers share the same read-only layers with separate writable layers. Volumes live outside and survive container deletion.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="535" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">Image layers and copy-on-write</tspan></text>
<rect x="50" y="78" width="440" height="44" rx="10" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="270" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="270" dy="0.0">👀 What the container sees: one merged filesystem</tspan></text>
<path d="M270,150 L270,126" fill="none" stroke="#15803d" stroke-width="1.8" marker-end="url(#ah-green)"/>
<rect x="50" y="155" width="440" height="48" rx="8" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" stroke-dasharray="6 5" opacity="1"/><text x="66" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#a85a00" text-anchor="start"><tspan x="66" dy="0.0">✏️ container layer (writable, thin)</tspan></text>
<rect x="360" y="163" width="118" height="32" rx="6" fill="#ffffff" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="419" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="419" dy="0.0">app.conf (edited)</tspan></text>
<rect x="50" y="215" width="440" height="48" rx="8" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="66" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="start"><tspan x="66" dy="0.0">④ COPY app.py .</tspan></text><text x="66" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="start"><tspan x="66" dy="0.0">your code</tspan></text>
<rect x="50" y="269" width="440" height="48" rx="8" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="66" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="start"><tspan x="66" dy="0.0">③ RUN pip install flask</tspan></text><text x="66" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="start"><tspan x="66" dy="0.0">dependencies</tspan></text>
<rect x="50" y="323" width="440" height="48" rx="8" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="66" y="345" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="start"><tspan x="66" dy="0.0">② RUN apk add curl</tspan></text><text x="66" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="start"><tspan x="66" dy="0.0">system tools</tspan></text>
<rect x="50" y="377" width="440" height="48" rx="8" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="66" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="start"><tspan x="66" dy="0.0">① FROM python:3.12-alpine</tspan></text><text x="66" y="417" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="start"><tspan x="66" dy="0.0">OS files + Python</tspan></text>
<rect x="360" y="385" width="118" height="32" rx="6" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="419" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="419" dy="0.0">app.conf</tspan></text>
<path d="M478,395 Q560,290 478,186" fill="none" stroke="#a85a00" stroke-width="2.2" marker-end="url(#ah-warm)"/>
<rect x="506" y="258" width="108" height="36" fill="#ffffff" opacity="0.92" rx="4"/><text x="560" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="560" dy="0.0">copied up</tspan><tspan x="560" dy="16.2">on first write</tspan></text>
<text x="30" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="30" dy="0.0">🔒</tspan></text><text x="30" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="30" dy="0.0">read</tspan><tspan x="30" dy="14.3">only</tspan></text>
<rect x="600" y="78" width="370" height="290" rx="14" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="785" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="785" dy="0.0">Two containers, one image</tspan></text>
<rect x="625" y="125" width="150" height="44" rx="8" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" stroke-dasharray="6 5" opacity="1"/><text x="700" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="700" dy="0.0">web-1 ✏️</tspan></text>
<path d="M700,170 L700,188" fill="none" stroke="#0b3d91" stroke-width="1.6" marker-end="url(#ah-blue_d)"/>
<rect x="790" y="125" width="150" height="44" rx="8" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" stroke-dasharray="6 5" opacity="1"/><text x="865" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="865" dy="0.0">web-2 ✏️</tspan></text>
<path d="M865,170 L865,188" fill="none" stroke="#0b3d91" stroke-width="1.6" marker-end="url(#ah-blue_d)"/>
<rect x="625" y="192" width="315" height="30" rx="6" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<rect x="625" y="226" width="315" height="30" rx="6" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<rect x="625" y="260" width="315" height="30" rx="6" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<rect x="625" y="294" width="315" height="30" rx="6" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="782" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="782" dy="0.0">image layers 1–4 (shared, read-only)</tspan></text>
<text x="785" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="785" dy="0.0">stored once on disk: 10 containers</tspan><tspan x="785" dy="16.2">don't cost 10× the image size</tspan></text>
<rect x="600" y="385" width="370" height="98" rx="14" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="785" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="785" dy="0.0">💾 Volume: /data</tspan></text>
<text x="785" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="785" dy="0.0">lives outside the container's layers:</tspan><tspan x="785" dy="16.2">docker rm deletes the writable layer,</tspan><tspan x="785" dy="16.2">volumes survive</tspan></text>
<text x="500" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="500" dy="0.0">🛋️ Like a furnished flat: every flat gets the builder's standard furniture (read-only, shared). Your own changes stay in your flat; moving out clears them.</tspan></text>
</svg>
