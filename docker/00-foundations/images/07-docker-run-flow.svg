<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 645" width="1000" height="645" role="img" aria-labelledby="t d">
<title id="t">Sequence of docker run nginx</title><desc id="d">Sequence: CLI posts to dockerd; dockerd checks the local image store; pulls manifest and layers from the registry; unpacks them; asks containerd to create and start a task; containerd starts a shim which runs runc; runc asks the kernel for namespaces and cgroups and execs nginx as PID 1; dockerd returns the container ID to the CLI.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="645" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">What really happens when you type docker run nginx</tspan></text>
<rect x="20" y="64" width="140" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="90" dy="0.0">⌨️ docker CLI</tspan></text>
<line x1="90" y1="106" x2="90" y2="605" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="190" y="64" width="140" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="260" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="260" dy="0.0">dockerd</tspan></text>
<line x1="260" y1="106" x2="260" y2="605" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="360" y="64" width="140" height="42" rx="10" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/>
<text x="430" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="430" dy="0.0">☁️ Registry</tspan></text>
<line x1="430" y1="106" x2="430" y2="605" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="530" y="64" width="140" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="600" dy="0.0">containerd</tspan></text>
<line x1="600" y1="106" x2="600" y2="605" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="700" y="64" width="140" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="770" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="770" dy="0.0">shim + runc</tspan></text>
<line x1="770" y1="106" x2="770" y2="605" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="855" y="64" width="140" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="925" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="925" dy="0.0">🐧 kernel</tspan></text>
<line x1="925" y1="106" x2="925" y2="605" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M90,148 L260,148" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="82" y="128" width="185" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="175.0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="175.0" dy="0.0">① POST /containers/create</tspan></text>
<path d="M260,184 q34,0 34,12 q0,12 -34,12" fill="none" stroke="#0b3d91" stroke-width="2" marker-end="url(#ah-blue_d)"/>
<rect x="297" y="188" width="185" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="302" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="302" dy="0.0">② nginx in local store? ✘</tspan></text>
<path d="M260,240 L430,240" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="256" y="220" width="178" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="345.0" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="345.0" dy="0.0">③ pull manifest + layers</tspan></text>
<path d="M430,286 L260,286" fill="none" stroke="#55637a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-muted)"/>
<rect x="266" y="266" width="157" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="345.0" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="345.0" dy="0.0">④ compressed layers ⬇</tspan></text>
<path d="M260,322 q34,0 34,12 q0,12 -34,12" fill="none" stroke="#0b3d91" stroke-width="2" marker-end="url(#ah-blue_d)"/>
<rect x="297" y="326" width="192" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="302" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="302" dy="0.0">⑤ unpack → rootfs + config</tspan></text>
<path d="M260,378 L600,378" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="327" y="358" width="206" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="430.0" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="430.0" dy="0.0">⑥ create + start task (gRPC)</tspan></text>
<path d="M600,424 L770,424" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="610" y="404" width="150" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="685.0" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="685.0" dy="0.0">⑦ shim → runc create</tspan></text>
<path d="M770,470 L925,470" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="741" y="450" width="213" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="847.5" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="847.5" dy="0.0">⑧ namespaces · cgroups · exec</tspan></text>
<path d="M925,506 q-34,0 -34,12 q0,12 34,12" fill="none" stroke="#0b3d91" stroke-width="2" marker-end="url(#ah-blue_d)"/>
<rect x="754" y="510" width="129" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="883" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="end"><tspan x="883" dy="0.0">⑨ nginx = PID 1 ✔</tspan></text>
<path d="M260,562 L90,562" fill="none" stroke="#55637a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-muted)"/>
<rect x="121" y="542" width="108" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="175.0" y="554" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="175.0" dy="0.0">⑩ container ID</tspan></text>
<text x="500" y="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="500" dy="0.0">runc exits once the container is running; the shim stays as its parent, so dockerd and containerd can restart without killing your containers.</tspan></text>
</svg>
