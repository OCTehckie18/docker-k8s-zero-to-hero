<text x="916" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="916" dy="0.0">📦 Container</tspan></text>
<text x="916" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="916" dy="0.0">nginx is running,</tspan><tspan x="916" dy="16.2">isolated</tspan></text>
<rect x="24" y="412" width="952" height="96" rx="14" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="500" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">🍰 cake = image   ·   🧊 fridge = local image store   ·   🏬 warehouse = registry   ·   🍽️ slice on a plate = container</tspan></text>
<text x="500" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">The warehouse never bakes anything: it only STORES finished cakes, labelled by name and version, and hands them out.</tspan></text>
<text x="500" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">Cakes are baked from a recipe (Dockerfile) by docker build or a CI pipeline, then pushed into the warehouse.</tspan></text>
<text x="500" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="500" dy="0.0">Where the analogy stops: a real cake runs out. An image never does: one image can serve unlimited containers.</tspan></text>
</svg>
