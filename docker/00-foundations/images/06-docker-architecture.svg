<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 585" width="1000" height="585" role="img" aria-labelledby="t d">
<title id="t">Docker architecture with a restaurant analogy</title><desc id="d">Analogy row: customer = you, waiter = docker CLI, head chef = dockerd, line cooks = containerd and runc, dish = container, pantry = local images, supplier = registry. Diagram: docker CLI calls dockerd over the REST API on docker.sock; dockerd manages images, networks, volumes, pulls from registries, and calls containerd over gRPC; containerd uses a shim and runc, which uses Linux kernel namespaces, cgroups and overlay filesystem to start containers.</desc>
