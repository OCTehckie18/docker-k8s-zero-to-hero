<title id="t">Era 1: physical servers</title><desc id="d">Analogy: a whole plot of land with one mansion where one family uses one bedroom. Technical: three physical servers, each with hardware, an operating system and a single app, mostly idle at 5 to 12 percent CPU.</desc>
