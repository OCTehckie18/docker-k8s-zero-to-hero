<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d">
<title id="t">How images travel through a registry</title><desc id="d">A developer or CI builds and pushes shop:1.4.2 to a registry such as Docker Hub or GHCR, which holds tags and digests. Staging, production and Kubernetes nodes pull the same image.</desc>
