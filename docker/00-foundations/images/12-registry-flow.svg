<text x="503" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="503" dy="0.0">Only missing layers are downloaded · tags are labels that can move, digests never change</tspan><tspan x="503" dy="21.7">Private registries need docker login · in production, pin a version or a digest</tspan></text>
