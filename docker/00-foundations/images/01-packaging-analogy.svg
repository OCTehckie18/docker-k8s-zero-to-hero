<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" width="1000" height="525" role="img" aria-labelledby="t d">
<title id="t">Phone packaging analogy for container images</title><desc id="d">A phone shipped loose arrives damaged; the same phone in fitted packaging arrives intact. Mapping: phone = application, accessories = libraries, package = image, unboxed phone = container, packing and shipping = Docker.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="525" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">Same phone. Different packaging. Different result.</tspan></text>
<rect x="30" y="70" width="455" height="270" rx="12" fill="#fdeeee" stroke="#c62828" stroke-width="1.6" opacity="1"/>
<text x="257" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#c62828" text-anchor="middle"><tspan x="257" dy="0.0">Scenario A: tossed loose in a big box</tspan></text>
<rect x="70" y="125" width="190" height="150" rx="6" fill="#e9c99d" stroke="#a8743c" stroke-width="1.6" opacity="1"/>
<g transform="rotate(-24 150 205)"><rect x="125" y="160" width="52" height="92" rx="8" fill="#0f1f3d" stroke="#0f1f3d" stroke-width="1.6" opacity="1"/><rect x="130" y="168" width="42" height="72" rx="4" fill="#9fb6d9" stroke="#9fb6d9" stroke-width="1.6" opacity="1"/><path d="M134,180 L160,214 M140,176 L168,206" stroke="#c62828" stroke-width="2"/></g>
<g transform="rotate(38 225 245)"><rect x="208" y="232" width="34" height="22" rx="4" fill="#ffffff" stroke="#55637a" stroke-width="1.6" opacity="1"/></g>
<text x="165" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="165" dy="0.0">nothing holds anything in place</tspan></text>
<text x="290" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#c62828" text-anchor="start"><tspan x="290" dy="0.0">❌ Scratched screen</tspan><tspan x="290" dy="33.0">❌ Charger lost</tspan><tspan x="290" dy="33.0">❌ May not even work</tspan></text>
<rect x="515" y="70" width="455" height="270" rx="12" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/>
<text x="742" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="742" dy="0.0">Scenario B: original, fitted packaging</tspan></text>
<rect x="555" y="125" width="200" height="150" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.6" opacity="1"/>
<rect x="568" y="138" width="66" height="124" rx="6" fill="#eef4ff" stroke="#9dbcf7" stroke-width="1.6" opacity="1"/>
<rect x="580" y="150" width="42" height="100" rx="7" fill="#0f1f3d" stroke="#0f1f3d" stroke-width="1.6" opacity="1"/><rect x="585" y="157" width="32" height="80" rx="3" fill="#9fb6d9" stroke="#9fb6d9" stroke-width="1.6" opacity="1"/>
<rect x="645" y="138" width="98" height="56" rx="6" fill="#eef4ff" stroke="#9dbcf7" stroke-width="1.6" opacity="1"/><text x="694" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b3d91" text-anchor="middle"><tspan x="694" dy="0.0">charger</tspan></text>
<rect x="645" y="206" width="98" height="56" rx="6" fill="#eef4ff" stroke="#9dbcf7" stroke-width="1.6" opacity="1"/><text x="694" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0b3d91" text-anchor="middle"><tspan x="694" dy="0.0">cable + SIM tool</tspan></text>
<text x="655" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="655" dy="0.0">everything has its place</tspan></text>
<text x="775" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15803d" text-anchor="start"><tspan x="775" dy="0.0">✅ Arrives as packed</tspan><tspan x="775" dy="33.0">✅ Nothing missing</tspan><tspan x="775" dy="33.0">✅ Works out of the box</tspan></text>
<rect x="30" y="360" width="940" height="122" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="500" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="500" dy="0.0">In software terms</tspan></text>
<text x="125.0" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="125.0" dy="0.0">📱 Phone</tspan></text><text x="125.0" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b3d91" text-anchor="middle"><tspan x="125.0" dy="0.0">= your application</tspan></text>
<text x="312.5" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="312.5" dy="0.0">🔌 Accessories</tspan></text><text x="312.5" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b3d91" text-anchor="middle"><tspan x="312.5" dy="0.0">= runtime + libraries</tspan></text>
<text x="500.0" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">📦 Sealed package</tspan></text><text x="500.0" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b3d91" text-anchor="middle"><tspan x="500.0" dy="0.0">= container image</tspan></text>
<text x="687.5" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="687.5" dy="0.0">📬 Unboxed &amp; in use</tspan></text><text x="687.5" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b3d91" text-anchor="middle"><tspan x="687.5" dy="0.0">= running container</tspan></text>
<text x="875.0" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="875.0" dy="0.0">🚚 Packing + shipping</tspan></text><text x="875.0" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b3d91" text-anchor="middle"><tspan x="875.0" dy="0.0">= Docker</tspan></text>
<text x="500" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="500" dy="0.0">Where the analogy stops: an image isn't a physical box. It's read-only file layers plus metadata, and “shipping” it is a download.</tspan></text>
</svg>
