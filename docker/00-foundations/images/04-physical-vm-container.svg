<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-labelledby="t d">
<title id="t">Physical servers vs virtual machines vs containers</title><desc id="d">Physical: hardware, host OS, one app, lots of idle capacity. Virtual machines: hardware, hypervisor, three VMs each with guest OS, libs and app. Containers: hardware, host OS with shared kernel, container runtime, three containers each with libs and app.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="510" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">Three ways to run three apps</tspan></text>
<text x="175" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="175" dy="0.0">🖥️ Physical servers</tspan></text><text x="175" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="175" dy="0.0">one app per machine</tspan></text>
<rect x="30" y="400" width="290" height="38" rx="6" fill="#dfe5ee" stroke="#55637a" stroke-width="1.6" opacity="1"/><text x="175" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="175" dy="0.0">Hardware</tspan></text>
<text x="500" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">🧱 Virtual machines</tspan></text><text x="500" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="500" dy="0.0">one OS per app</tspan></text>
<rect x="355" y="400" width="290" height="38" rx="6" fill="#dfe5ee" stroke="#55637a" stroke-width="1.6" opacity="1"/><text x="500" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">Hardware</tspan></text>
<text x="825" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="825" dy="0.0">📦 Containers</tspan></text><text x="825" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="825" dy="0.0">one kernel, many isolated apps</tspan></text>
