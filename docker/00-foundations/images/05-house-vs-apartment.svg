<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-labelledby="t d">
<title id="t">Houses versus apartments: VMs versus containers</title><desc id="d">Three houses each with their own foundation, plumbing and power map to VMs with their own guest OS. One apartment building with shared foundation maps to containers sharing the host kernel while keeping private files, processes and network.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="530" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">VMs are houses. Containers are apartments.</tspan></text>
<rect x="30" y="70" width="455" height="280" rx="12" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/>
<text x="257" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="257" dy="0.0">🏠 Three separate houses</tspan></text>
<polygon points="48,190 110,132 172,190" fill="#f7d9b0" stroke="#a8743c" stroke-width="1.6"/>
<rect x="58" y="190" width="104" height="88" rx="2" fill="#ffffff" stroke="#a8743c" stroke-width="1.6" opacity="1"/>
<rect x="98" y="240" width="24" height="38" rx="2" fill="#e9c99d" stroke="#a8743c" stroke-width="1.6" opacity="1"/>
<text x="110" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="110" dy="0.0">🔌 💧 🔥</tspan></text>
<rect x="48" y="278" width="124" height="12" rx="2" fill="#8a6a4a" stroke="#8a6a4a" stroke-width="1.6" opacity="1"/>
<text x="110" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="110" dy="0.0">Family A</tspan></text>
<polygon points="195,190 257,132 319,190" fill="#f7d9b0" stroke="#a8743c" stroke-width="1.6"/>
<rect x="205" y="190" width="104" height="88" rx="2" fill="#ffffff" stroke="#a8743c" stroke-width="1.6" opacity="1"/>
<rect x="245" y="240" width="24" height="38" rx="2" fill="#e9c99d" stroke="#a8743c" stroke-width="1.6" opacity="1"/>
<text x="257" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="257" dy="0.0">🔌 💧 🔥</tspan></text>
<rect x="195" y="278" width="124" height="12" rx="2" fill="#8a6a4a" stroke="#8a6a4a" stroke-width="1.6" opacity="1"/>
<text x="257" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="257" dy="0.0">Family B</tspan></text>
<polygon points="342,190 404,132 466,190" fill="#f7d9b0" stroke="#a8743c" stroke-width="1.6"/>
<rect x="352" y="190" width="104" height="88" rx="2" fill="#ffffff" stroke="#a8743c" stroke-width="1.6" opacity="1"/>
<rect x="392" y="240" width="24" height="38" rx="2" fill="#e9c99d" stroke="#a8743c" stroke-width="1.6" opacity="1"/>
<text x="404" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="404" dy="0.0">🔌 💧 🔥</tspan></text>
<rect x="342" y="278" width="124" height="12" rx="2" fill="#8a6a4a" stroke="#8a6a4a" stroke-width="1.6" opacity="1"/>
<text x="404" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="404" dy="0.0">Family C</tspan></text>
<text x="257" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="257" dy="0.0">each: own foundation, plumbing, power</tspan></text>
<rect x="515" y="70" width="455" height="280" rx="12" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/>
<text x="742" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="742" dy="0.0">🏢 One apartment building</tspan></text>
<rect x="612" y="118" width="260" height="162" rx="4" fill="#ffffff" stroke="#a8743c" stroke-width="1.6" opacity="1"/>
<rect x="622" y="128" width="76" height="64" rx="4" fill="#eef4ff" stroke="#9dbcf7" stroke-width="1.6" opacity="1"/><text x="660" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="660" dy="0.0">App A</tspan></text>
<rect x="706" y="128" width="76" height="64" rx="4" fill="#eef4ff" stroke="#9dbcf7" stroke-width="1.6" opacity="1"/><text x="744" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="744" dy="0.0">App B</tspan></text>
<rect x="790" y="128" width="76" height="64" rx="4" fill="#eef4ff" stroke="#9dbcf7" stroke-width="1.6" opacity="1"/><text x="828" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="828" dy="0.0">App C</tspan></text>
<rect x="622" y="202" width="76" height="64" rx="4" fill="#eef4ff" stroke="#9dbcf7" stroke-width="1.6" opacity="1"/><text x="660" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="660" dy="0.0">App D</tspan></text>
<rect x="706" y="202" width="76" height="64" rx="4" fill="#eef4ff" stroke="#9dbcf7" stroke-width="1.6" opacity="1"/><text x="744" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="744" dy="0.0">App E</tspan></text>
<rect x="790" y="202" width="76" height="64" rx="4" fill="#eef4ff" stroke="#9dbcf7" stroke-width="1.6" opacity="1"/><text x="828" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="828" dy="0.0">App F</tspan></text>
<rect x="592" y="280" width="300" height="14" rx="2" fill="#8a6a4a" stroke="#8a6a4a" stroke-width="1.6" opacity="1"/>
<text x="742" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="742" dy="0.0">🔌 💧 🔥  shared foundation, plumbing, power</tspan></text>
<text x="742" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="742" dy="0.0">each flat: own door, rooms, belongings</tspan></text>
<rect x="30" y="370" width="455" height="120" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="44" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="start"><tspan x="44" dy="0.0">Virtual machines</tspan></text><text x="44" y="417" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#55637a" text-anchor="start"><tspan x="44" dy="0.0">• each VM runs its own guest OS and kernel</tspan><tspan x="44" dy="18.2">• a hypervisor slices up the hardware</tspan><tspan x="44" dy="18.2">• strongest isolation, more overhead</tspan></text>
<rect x="515" y="370" width="455" height="120" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="529" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="start"><tspan x="529" dy="0.0">Containers</tspan></text><text x="529" y="417" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#55637a" text-anchor="start"><tspan x="529" dy="0.0">• own files, processes, network, hostname</tspan><tspan x="529" dy="18.2">• all share the host's Linux kernel</tspan><tspan x="529" dy="18.2">• lighter and faster to start</tspan></text>
<text x="500" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="500" dy="0.0">Where the analogy breaks: a kernel bug is a crack in the shared foundation and can affect every flat. That's why VMs still matter.</tspan></text>
</svg>
