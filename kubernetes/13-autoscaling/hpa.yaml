apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          env: [ { name: REDIS_HOST, value: redis } ]
          ports: [ { containerPort: 8080 } ]
          resources:
            requests: { cpu: 100m, memory: 64Mi }   # HPA % is calculated against REQUESTS
            limits:   { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [ { port: 8080, targetPort: 8080 } ]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50          # aim for 50% of requested CPU per Pod
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30      # default is 300s; shortened so the lab is quick
