apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis              # a Service name: resolved by cluster DNS
          ports:
            - name: http                # named port: Services can target it by name
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP                       # default: reachable only inside the cluster
  selector:
    app: api                            # send traffic to Pods with this label
  ports:
    - name: http
      port: 8080                        # the port clients use:  http://api:8080
      targetPort: http                  # the container port (by name)
