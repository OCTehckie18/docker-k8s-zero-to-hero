# Security hardening: the client may ONLY talk to the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: client-egress, namespace: troubleshoot }
spec:
  podSelector: { matchLabels: { role: client } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: ts-api } }
      ports: [ { port: 8080 } ]
    - to:                                   # allow DNS lookups to CoreDNS
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ts-api, namespace: troubleshoot }
spec:
  replicas: 2
  selector: { matchLabels: { app: ts-api } }
  template:
    metadata: { labels: { app: ts-api } }
    spec:
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8080 } ]
---
apiVersion: v1
kind: Service
metadata: { name: ts-api, namespace: troubleshoot }
spec:
  selector: { app: ts-api }
  ports: [ { port: 8080, targetPort: 8080 } ]
---
# The "user": calls the app every 2 seconds and logs the result.
apiVersion: v1
kind: Pod
metadata: { name: ts-client, namespace: troubleshoot, labels: { role: client } }
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "while true; do if wget -qO- -T 2 'http://ts-api:8080/api/info' >/dev/null 2>&1; then echo \"$(date +%T) ✅ OK\"; else echo \"$(date +%T) ❌ FAILED\"; fi; sleep 2; done"]
