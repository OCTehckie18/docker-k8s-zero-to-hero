apiVersion: apps/v1
kind: Deployment
metadata: { name: ts-report, namespace: troubleshoot }
spec:
  replicas: 1
  selector: { matchLabels: { app: ts-report } }
  template:
    metadata: { labels: { app: ts-report } }
    spec:
      containers:
        - name: report
          image: python:3.12-alpine
          command: ["python", "-c", "import time; print('loading 150MB of report data...', flush=True); data = bytearray(150*1024*1024); print('report ready', flush=True); time.sleep(3600)"]
          resources:
            requests: { memory: 64Mi }
            limits:   { memory: 64Mi }
