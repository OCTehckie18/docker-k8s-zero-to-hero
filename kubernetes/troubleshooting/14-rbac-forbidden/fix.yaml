apiVersion: v1
kind: ServiceAccount
metadata: { name: pod-watcher, namespace: troubleshoot }
---
apiVersion: v1
kind: Pod
metadata: { name: ts-watcher, namespace: troubleshoot }
spec:
  serviceAccountName: pod-watcher
  containers:
    - name: watcher
      image: curlimages/curl:8.11.1
      command: ["sh", "-c", "T=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token); while true; do curl -s -o /tmp/out -w \"$(date +%T) HTTP %{http_code}\\n\" --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H \"Authorization: Bearer $T\" https://kubernetes.default.svc/api/v1/namespaces/troubleshoot/pods; grep -o '\"message\": \"[^\"]*' /tmp/out | head -1; sleep 3; done"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: read-pods, namespace: troubleshoot }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: pod-watcher-read-pods, namespace: troubleshoot }
subjects:
  - kind: ServiceAccount
    name: pod-watcher
    namespace: troubleshoot
roleRef:
  kind: Role
  name: read-pods
  apiGroup: rbac.authorization.k8s.io
