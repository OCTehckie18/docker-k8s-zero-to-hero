apiVersion: apps/v1
kind: Deployment
metadata: { name: ts-slow, namespace: troubleshoot }
spec:
  replicas: 1
  selector: { matchLabels: { app: ts-slow } }
  template:
    metadata: { labels: { app: ts-slow } }
    spec:
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          env: [ { name: STARTUP_DELAY, value: "25" } ]     # loads a big cache at boot
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 3
            failureThreshold: 2
