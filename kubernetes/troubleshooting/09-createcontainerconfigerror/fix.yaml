apiVersion: v1
kind: Secret
metadata: { name: ts-db-credentials, namespace: troubleshoot }
type: Opaque
stringData:
  password: dev-only
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ts-config, namespace: troubleshoot }
spec:
  replicas: 1
  selector: { matchLabels: { app: ts-config } }
  template:
    metadata: { labels: { app: ts-config } }
    spec:
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ts-db-credentials
                  key: password
