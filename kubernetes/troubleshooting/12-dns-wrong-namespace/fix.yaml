apiVersion: v1
kind: Namespace
metadata: { name: ts-backend }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: inventory, namespace: ts-backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory } }
  template:
    metadata: { labels: { app: inventory } }
    spec:
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8080 } ]
---
apiVersion: v1
kind: Service
metadata: { name: inventory, namespace: ts-backend }
spec:
  selector: { app: inventory }
  ports: [ { port: 8080, targetPort: 8080 } ]
---
# The "user": calls the app every 2 seconds and logs the result.
apiVersion: v1
kind: Pod
metadata: { name: ts-client, namespace: troubleshoot, labels: { role: client } }
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "while true; do if wget -qO- -T 2 'http://inventory.ts-backend.svc.cluster.local:8080/api/info' >/dev/null 2>&1; then echo \"$(date +%T) ✅ OK\"; else echo \"$(date +%T) ❌ FAILED\"; fi; sleep 2; done"]
