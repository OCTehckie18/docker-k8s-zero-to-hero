apiVersion: v1
kind: Service
metadata: { name: redis, namespace: troubleshoot }
spec:
  selector: { app: ts-cache }
  ports: [ { port: 6379 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ts-worker, namespace: troubleshoot }
spec:
  replicas: 1
  selector: { matchLabels: { app: ts-worker } }
  template:
    metadata: { labels: { app: ts-worker } }
    spec:
      containers:
        - name: worker
          image: python:3.12-alpine
          command: ["python", "-c", "import os, time; port = int(os.environ.get('REDIS_PORT', '6379')); print(f'worker started, will use redis port {port}', flush=True); time.sleep(3600)"]
