apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ts-data, namespace: troubleshoot }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fast-ssd             # copied from the production cluster
  resources: { requests: { storage: 100Mi } }
---
apiVersion: v1
kind: Pod
metadata: { name: ts-db, namespace: troubleshoot }
spec:
  containers:
    - name: db
      image: redis:7-alpine
      volumeMounts: [ { name: data, mountPath: /data } ]
  volumes:
    - name: data
      persistentVolumeClaim: { claimName: ts-data }
