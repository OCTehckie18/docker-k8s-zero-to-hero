apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-shop
  namespace: troubleshoot
  annotations: { kubernetes.io/change-cause: "v1 good release" }
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: ts-shop } }
  template:
    metadata: { labels: { app: ts-shop } }
    spec:
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          env: [ { name: APP_VERSION, value: "1.0.0" } ]
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 2
