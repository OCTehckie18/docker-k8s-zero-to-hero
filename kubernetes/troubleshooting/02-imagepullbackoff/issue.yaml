apiVersion: apps/v1
kind: Deployment
metadata: { name: ts-web, namespace: troubleshoot }
spec:
  replicas: 1
  selector: { matchLabels: { app: ts-web } }
  template:
    metadata: { labels: { app: ts-web } }
    spec:
      containers:
        - name: web
          image: nginx:1.99.99-alpine      # "upgrade" to a version that does not exist
