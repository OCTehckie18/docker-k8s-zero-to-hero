apiVersion: apps/v1
kind: Deployment
metadata: { name: ts-greedy, namespace: troubleshoot }
spec:
  replicas: 3
  selector: { matchLabels: { app: ts-greedy } }
  template:
    metadata: { labels: { app: ts-greedy } }
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: "64"          # 64 whole CPUs per Pod
              memory: 64Mi
