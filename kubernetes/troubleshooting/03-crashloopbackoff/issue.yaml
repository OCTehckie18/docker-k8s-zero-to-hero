apiVersion: apps/v1
kind: Deployment
metadata: { name: ts-crash, namespace: troubleshoot }
spec:
  replicas: 1
  selector: { matchLabels: { app: ts-crash } }
  template:
    metadata: { labels: { app: ts-crash } }
    spec:
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "server.py"]     # the "new" start command
