# Three Pods, three QoS classes.
apiVersion: v1
kind: Pod
metadata: { name: qos-guaranteed, labels: { lab: qos } }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:                       # requests == limits for cpu AND memory
        requests: { cpu: 100m, memory: 64Mi }
        limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Pod
metadata: { name: qos-burstable, labels: { lab: qos } }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:                       # requests < limits
        requests: { cpu: 50m, memory: 32Mi }
        limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Pod
metadata: { name: qos-besteffort, labels: { lab: qos } }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]       # no resources at all
