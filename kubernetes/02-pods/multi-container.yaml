# Three patterns in one Pod:
#  - an init container that runs to completion BEFORE the app starts
#  - the main app container
#  - a sidecar that shares the app's volume and network
apiVersion: v1
kind: Pod
metadata:
  name: web-with-sidecar
  labels:
    app: web-with-sidecar
spec:
  initContainers:
    - name: write-content
      image: busybox:1.36
      command: ["sh", "-c", "echo writing index.html; echo \"<h1>Generated by an init container at $(date)</h1>\" > /work/index.html; echo done"]
      volumeMounts:
        - name: html
          mountPath: /work
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: logs
          mountPath: /var/log/nginx
    - name: log-shipper           # sidecar: tails the access log nginx writes into the shared volume
      image: busybox:1.36
      command: ["sh", "-c", "touch /logs/access.log; tail -F /logs/access.log"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  volumes:
    - name: html
      emptyDir: {}
    - name: logs
      emptyDir: {}
