<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
<title id="t">How a request reaches a Pod through a Service</title><desc id="d">A user reaches a Gateway or Ingress, which forwards to a Service with a stable virtual IP and DNS name; CoreDNS resolves the name; the EndpointSlice lists only Ready Pod IPs; traffic goes to the two Ready Pods and not the one that is not Ready. Analogy: a company's main phone number.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="500" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">How a request finds a Pod</tspan></text>
<rect x="30" y="175" width="130" height="72" rx="12" fill="#ffffff" stroke="#0f1f3d" stroke-width="1.6" opacity="1"/><text x="95.0" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="95.0" dy="0.0">📱 User</tspan></text><text x="95.0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="95.0" dy="0.0">browser / phone</tspan></text>
<path d="M162,211 L196,211" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="200" y="175" width="160" height="72" rx="12" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="280.0" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="280.0" dy="0.0">🚪 Gateway</tspan></text><text x="280.0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="280.0" dy="0.0">or Ingress: one</tspan><tspan x="280.0" dy="15.6">entry point</tspan></text>
<path d="M362,211 L406,211" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="410" y="160" width="200" height="102" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="510.0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="510.0" dy="0.0">🧭 Service: api</tspan></text><text x="510.0" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="510.0" dy="0.0">virtual IP 10.96.12.4</tspan><tspan x="510.0" dy="15.6">DNS: api.shop.svc</tspan><tspan x="510.0" dy="15.6">load-balances</tspan></text>
