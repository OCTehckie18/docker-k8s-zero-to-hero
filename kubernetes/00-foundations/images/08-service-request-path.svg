<path d="M612,211 L696,308" fill="none" stroke="#55637a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-muted)"/><text x="660" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#c62828" text-anchor="middle"><tspan x="660" dy="0.0">✘</tspan></text>
<rect x="700" y="276" width="260" height="64" rx="10" fill="#f4f6f9" stroke="#55637a" stroke-width="1.6" opacity="1"/><text x="718" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="start"><tspan x="718" dy="0.0">📦 Pod 10.244.2.9</tspan></text><text x="718" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#55637a" text-anchor="start"><tspan x="718" dy="0.0">⏳ not Ready</tspan></text>
<rect x="200" y="300" width="160" height="70" rx="12" fill="#ffffff" stroke="#55637a" stroke-width="1.6" opacity="1"/><text x="280.0" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="280.0" dy="0.0">📇 CoreDNS</tspan></text><text x="280.0" y="347" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="280.0" dy="0.0">api → 10.96.12.4</tspan></text>
<path d="M362,335 L430,266" fill="none" stroke="#55637a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ah-muted)"/>
<rect x="410" y="300" width="200" height="70" rx="12" fill="#ffffff" stroke="#55637a" stroke-width="1.6" opacity="1"/><text x="510.0" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="510.0" dy="0.0">📜 EndpointSlice</tspan></text><text x="510.0" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="510.0" dy="0.0">only Ready Pod IPs</tspan></text>
<path d="M510,264 L510,298" fill="none" stroke="#55637a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ah-muted)"/>
<text x="510" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="510" dy="0.0">kube-proxy on every node turns this into routing rules</tspan></text>
<rect x="30" y="415" width="940" height="68" rx="12" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/>
<text x="500" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">📞 A Service is a company's main phone number. Callers never need to know which employee (Pod) answers,</tspan><tspan x="500" dy="18.8">or that employees change desks every day. Someone who is out sick (not Ready) simply isn't put through.</tspan></text>
