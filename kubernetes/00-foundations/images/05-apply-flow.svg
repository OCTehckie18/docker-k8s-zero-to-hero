<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d">
<title id="t">Sequence after kubectl create deployment</title><desc id="d">kubectl posts a Deployment to the API server, which authenticates, authorizes, admits and stores it in etcd. The Deployment controller creates a ReplicaSet; the ReplicaSet controller creates 3 Pods; the scheduler binds them to nodes; the kubelet sees its Pod, asks containerd via CRI to pull and run it; runc starts the container; the kubelet reports status back.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">What happens after kubectl create deployment web --replicas=3</tspan></text>
<rect x="16" y="64" width="128" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="80" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="80" dy="0.0">⌨️ kubectl</tspan></text>
<line x1="80" y1="106" x2="80" y2="600" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="161" y="64" width="128" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="225" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="225" dy="0.0">API server</tspan></text>
<line x1="225" y1="106" x2="225" y2="600" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="301" y="64" width="128" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="365" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="365" dy="0.0">etcd</tspan></text>
<line x1="365" y1="106" x2="365" y2="600" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="441" y="64" width="128" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="505" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="505" dy="0.0">controllers</tspan></text>
<line x1="505" y1="106" x2="505" y2="600" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="581" y="64" width="128" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="645" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="645" dy="0.0">scheduler</tspan></text>
<line x1="645" y1="106" x2="645" y2="600" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="721" y="64" width="128" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="785" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="785" dy="0.0">kubelet</tspan></text>
<line x1="785" y1="106" x2="785" y2="600" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="861" y="64" width="128" height="42" rx="10" fill="#cfe0fd" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="925" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="925" dy="0.0">containerd</tspan></text>
<line x1="925" y1="106" x2="925" y2="600" stroke="#c4cfdd" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M80,146 L225,146" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="88" y="126" width="129" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="152.5" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="152.5" dy="0.0">① POST Deployment</tspan></text>
<path d="M225,181 q34,0 34,12 q0,12 -34,12" fill="none" stroke="#0b3d91" stroke-width="2" marker-end="url(#ah-blue_d)"/>
<rect x="262" y="184" width="199" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="267" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="start"><tspan x="267" dy="0.0">② authn · authz · admission</tspan></text>
<path d="M225,236 L365,236" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="220" y="216" width="150" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="295.0" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="295.0" dy="0.0">③ save desired state</tspan></text>
<path d="M505,281 L225,281" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="234" y="260" width="262" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="365.0" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="365.0" dy="0.0">④ Deployment ctrl: make a ReplicaSet</tspan></text>
<path d="M505,326 L225,326" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="255" y="306" width="220" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="365.0" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="365.0" dy="0.0">⑤ ReplicaSet ctrl: make 3 Pods</tspan></text>
<path d="M645,371 L225,371" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="342" y="350" width="185" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="435.0" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="435.0" dy="0.0">⑥ bind each Pod to a node</tspan></text>
<path d="M225,416 L785,416" fill="none" stroke="#55637a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-muted)"/>
<rect x="384" y="396" width="241" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="505.0" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="505.0" dy="0.0">⑦ kubelet sees: a Pod for my node</tspan></text>
<path d="M785,461 L925,461" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="790" y="440" width="129" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="855.0" y="453" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="855.0" dy="0.0">⑧ CRI: pull + run</tspan></text>
<path d="M925,496 q-34,0 -34,12 q0,12 34,12" fill="none" stroke="#0b3d91" stroke-width="2" marker-end="url(#ah-blue_d)"/>
<rect x="733" y="500" width="150" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="883" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="end"><tspan x="883" dy="0.0">⑨ runc → container ✔</tspan></text>
<path d="M785,551 L225,551" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<rect x="416" y="530" width="178" height="20" fill="#ffffff" opacity="0.92" rx="4"/><text x="505.0" y="543" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f1f3d" text-anchor="middle"><tspan x="505.0" dy="0.0">⑩ status: Running, Ready</tspan></text>
<text x="500" y="625" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle" font-style="italic"><tspan x="500" dy="0.0">Nobody calls anybody directly: every component watches the API server and reacts. That's what makes Kubernetes resilient and extensible.</tspan></text>
</svg>
