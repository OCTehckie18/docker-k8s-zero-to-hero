<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-labelledby="t d">
<title id="t">How Docker and Kubernetes relate</title><desc id="d">Docker on a laptop: CLI, dockerd, containerd, runc, kernel. A Kubernetes node: kubelet, CRI, containerd or CRI-O, runc, kernel. Both run the same OCI images. Myth busted: removing dockershim did not stop Docker-built images from running.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="510" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">Docker and Kubernetes: teammates, not rivals</tspan></text>
<text x="210" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="210" dy="0.0">💻 Your laptop with Docker</tspan></text>
<rect x="60" y="110" width="300" height="46" rx="8" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="210" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="210" dy="0.0">docker CLI</tspan></text>
<rect x="60" y="166" width="300" height="46" rx="8" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="210" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="210" dy="0.0">dockerd</tspan></text>
<rect x="60" y="222" width="300" height="46" rx="8" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="210" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="210" dy="0.0">containerd</tspan></text>
<rect x="60" y="278" width="300" height="46" rx="8" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="210" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="210" dy="0.0">runc</tspan></text>
<rect x="60" y="334" width="300" height="46" rx="8" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="210" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="210" dy="0.0">Linux kernel</tspan></text>
<text x="790" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="790" dy="0.0">🖥️ A Kubernetes node</tspan></text>
<rect x="640" y="110" width="300" height="46" rx="8" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="790" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="790" dy="0.0">kubelet</tspan></text>
<rect x="640" y="166" width="300" height="46" rx="8" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="790" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="790" dy="0.0">CRI (gRPC API)</tspan></text>
<rect x="640" y="222" width="300" height="46" rx="8" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="790" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="790" dy="0.0">containerd or CRI-O</tspan></text>
<rect x="640" y="278" width="300" height="46" rx="8" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="790" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="790" dy="0.0">runc</tspan></text>
<rect x="640" y="334" width="300" height="46" rx="8" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="790" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="790" dy="0.0">Linux kernel</tspan></text>
<rect x="400" y="170" width="200" height="120" rx="14" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="500" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">📦 OCI image</tspan></text>
<text x="500" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">one standard format:</tspan><tspan x="500" dy="16.2">build with Docker,</tspan><tspan x="500" dy="16.2">run anywhere</tspan></text>
<path d="M400,230 L362,230" fill="none" stroke="#a85a00" stroke-width="2.2" marker-end="url(#ah-warm)"/><path d="M600,230 L638,230" fill="none" stroke="#a85a00" stroke-width="2.2" marker-end="url(#ah-warm)"/>
<text x="500" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="500" dy="0.0">green = the same building blocks</tspan></text>
<rect x="60" y="400" width="880" height="92" rx="12" fill="#fdeeee" stroke="#c62828" stroke-width="1.6" opacity="1"/>
<text x="500" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#c62828" text-anchor="middle"><tspan x="500" dy="0.0">Myth: “Kubernetes removed Docker, so Docker is dead.”</tspan></text>
<text x="500" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">Fact: v1.24 removed dockershim, the adapter between the kubelet and dockerd. Images you build with Docker</tspan><tspan x="500" dy="18.8">run unchanged, and developers still use Docker every day to build, test and run containers locally.</tspan></text>
</svg>
