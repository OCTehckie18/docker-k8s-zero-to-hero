<title id="t">Kubernetes architecture with a container-port analogy</title><desc id="d">Control plane (port authority): etcd records office, kube-scheduler berth planner, controller-manager inspectors, cloud-controller-manager city liaison, kube-apiserver front desk that kubectl talks to. Worker nodes (docks): kubelet foreman, kube-proxy signposts, containerd cranes, running Pods.</desc>
