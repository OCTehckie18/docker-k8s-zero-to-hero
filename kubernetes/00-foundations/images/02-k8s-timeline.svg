<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" width="1000" height="475" role="img" aria-labelledby="t d">
<title id="t">Kubernetes history timeline</title><desc id="d">Borg 2003, Docker and Omega 2013, Kubernetes open-sourced June 2014, v1.0 and CNCF July 2015, orchestration wars end 2017, CNCF graduation 2018, dockershim deprecated 2020, removed in 1.24 in 2022, Gateway API v1.0 in 2023.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="475" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">From Google's Borg to everyone's platform</tspan></text>
<line x1="45" y1="245" x2="957" y2="245" stroke="#1d63ed" stroke-width="3"/><line x1="105" y1="245" x2="105" y2="219" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="15.0" y="117" width="180" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="105" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="105" dy="0.0">2003</tspan></text><text x="105" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="105" dy="0.0">Borg</tspan></text><text x="105" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="105" dy="0.0">Google's internal</tspan><tspan x="105" dy="15.4">cluster manager</tspan></text><circle cx="105" cy="245" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="204" y1="245" x2="204" y2="271" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="114.0" y="271" width="180" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="204" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="204" dy="0.0">2013</tspan></text><text x="204" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="204" dy="0.0">Docker + Omega</tspan></text><text x="204" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="204" dy="0.0">easy containers; Google</tspan><tspan x="204" dy="15.4">publishes Omega paper</tspan></text><circle cx="204" cy="245" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="303" y1="245" x2="303" y2="219" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="213.0" y="117" width="180" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="303" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="303" dy="0.0">2014</tspan></text><text x="303" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="303" dy="0.0">Kubernetes born</tspan></text><text x="303" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="303" dy="0.0">June: open-sourced</tspan><tspan x="303" dy="15.4">by Google, written in Go</tspan></text><circle cx="303" cy="245" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="402" y1="245" x2="402" y2="271" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="312.0" y="271" width="180" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="402" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="402" dy="0.0">2015</tspan></text><text x="402" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="402" dy="0.0">v1.0 + CNCF</tspan></text><text x="402" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="402" dy="0.0">July: donated to the</tspan><tspan x="402" dy="15.4">new CNCF foundation</tspan></text><circle cx="402" cy="245" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="501" y1="245" x2="501" y2="219" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="411.0" y="117" width="180" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="501" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="501" dy="0.0">2017</tspan></text><text x="501" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="501" dy="0.0">Orchestration wars end</tspan></text><text x="501" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="501" dy="0.0">Docker, AWS, Azure</tspan><tspan x="501" dy="15.4">all back Kubernetes</tspan></text><circle cx="501" cy="245" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="600" y1="245" x2="600" y2="271" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="510.0" y="271" width="180" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="600" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="600" dy="0.0">2018</tspan></text><text x="600" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="600" dy="0.0">CNCF graduation</tspan></text><text x="600" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="600" dy="0.0">first project to</tspan><tspan x="600" dy="15.4">graduate (March)</tspan></text><circle cx="600" cy="245" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="699" y1="245" x2="699" y2="219" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="609.0" y="117" width="180" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="699" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="699" dy="0.0">2020</tspan></text><text x="699" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="699" dy="0.0">dockershim deprecated</tspan></text><text x="699" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="699" dy="0.0">v1.20: kubelet should</tspan><tspan x="699" dy="15.4">talk CRI directly</tspan></text><circle cx="699" cy="245" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="798" y1="245" x2="798" y2="271" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="708.0" y="271" width="180" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="798" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="798" dy="0.0">2022</tspan></text><text x="798" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="798" dy="0.0">v1.24</tspan></text><text x="798" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="798" dy="0.0">dockershim removed;</tspan><tspan x="798" dy="15.4">Docker images still run</tspan></text><circle cx="798" cy="245" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/><line x1="897" y1="245" x2="897" y2="219" stroke="#9dbcf7" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="807.0" y="117" width="180" height="102" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="897" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d63ed" text-anchor="middle"><tspan x="897" dy="0.0">2023</tspan></text><text x="897" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="897" dy="0.0">Gateway API v1.0</tspan></text><text x="897" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="897" dy="0.0">modern traffic</tspan><tspan x="897" dy="15.4">routing goes GA</tspan></text><circle cx="897" cy="245" r="7" fill="#ffffff" stroke="#1d63ed" stroke-width="3"/>
<rect x="160" y="408" width="680" height="50" rx="12" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/>
<text x="500" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b3d91" text-anchor="middle"><tspan x="500" dy="0.0">⎈ Kubernetes = Greek for “helmsman” (the one who steers the ship) · “K8s” = K + 8 letters + s</tspan></text>
