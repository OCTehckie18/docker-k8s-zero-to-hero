<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" width="1000" height="565" role="img" aria-labelledby="t d">
<title id="t">The Kubernetes reconciliation loop</title><desc id="d">Desired state (replicas 3) is observed against actual state (2 Pods), compared (1 missing), acted upon (create 1 Pod), forever. Analogy: a thermostat.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="565" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">The heart of Kubernetes: the reconciliation loop</tspan></text>
<rect x="400" y="75" width="200" height="74" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="500" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">📝 Desired state</tspan></text><text x="500" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="500" dy="0.0">YAML: replicas: 3</tspan></text>
<rect x="690" y="205" width="200" height="74" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="790" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="790" dy="0.0">👀 Observe</tspan></text><text x="790" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="790" dy="0.0">actual: 2 Pods running</tspan></text>
<rect x="400" y="335" width="200" height="74" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="500" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500" dy="0.0">⚖️ Compare</tspan></text><text x="500" y="389" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="500" dy="0.0">3 wanted − 2 seen = 1 missing</tspan></text>
<rect x="110" y="205" width="200" height="74" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="210" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="210" dy="0.0">🔧 Act</tspan></text><text x="210" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="210" dy="0.0">create 1 Pod</tspan></text>
<path d="M602,112 Q720,112 760,202" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<path d="M790,281 Q790,372 602,372" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<path d="M398,372 Q210,372 210,281" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<path d="M240,202 Q240,112 398,112" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<text x="500" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="500" dy="0.0">🔁 forever</tspan><tspan x="500" dy="18.9">(every few seconds,</tspan><tspan x="500" dy="18.9">for every object)</tspan></text>
<rect x="30" y="440" width="455" height="110" rx="14" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="257" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="257" dy="0.0">🌡️ Analogy: a thermostat</tspan></text>
<text x="257" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="257" dy="0.0">You set 22 °C (desired). It measures 19 °C</tspan><tspan x="257" dy="17.6">(observe), switches the heater on (act), and keeps</tspan><tspan x="257" dy="17.6">checking. You never “run the heater” yourself.</tspan></text>
<rect x="515" y="440" width="455" height="110" rx="14" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="742" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="742" dy="0.0">In Kubernetes</tspan></text>
<text x="742" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="742" dy="0.0">You never say “start a Pod”. You say “there</tspan><tspan x="742" dy="17.6">should be 3”. Controllers make it true, and</tspan><tspan x="742" dy="17.6">keep it true when nodes and Pods fail.</tspan></text>
</svg>
