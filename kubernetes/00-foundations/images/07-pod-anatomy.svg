<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a Pod</title><desc id="d">A Pod with one IP holds an app container and a sidecar that share a network namespace (talk via localhost) and a volume. They are scheduled, started and deleted together. Analogy: peas in a pod, a pod of whales.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d63ed"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55637a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a85a00"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1f3d"/></marker><marker id="ah-blue_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker></defs>
<rect width="1000" height="440" fill="#ffffff"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="500.0" dy="0.0">Inside a Pod</tspan></text>
<rect x="30" y="70" width="590" height="350" rx="16" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6" opacity="1"/><text x="325" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="325" dy="0.0">📦 Pod: api-7c9f-x2k   ·   IP 10.244.1.7</tspan></text>
<rect x="52" y="115" width="546" height="44" rx="10" fill="#ffffff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="325" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b3d91" text-anchor="middle"><tspan x="325" dy="0.0">🌐 one shared network: one IP; containers talk over localhost</tspan></text>
<rect x="60" y="180" width="240" height="120" rx="12" fill="#ffffff" stroke="#0f1f3d" stroke-width="1.6" opacity="1"/><text x="180.0" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="180.0" dy="0.0">🐱 app container</tspan></text><text x="180.0" y="227" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="180.0" dy="0.0">z2h/api:1.0</tspan><tspan x="180.0" dy="16.2">listens on :8080</tspan></text>
<rect x="350" y="180" width="240" height="120" rx="12" fill="#ffffff" stroke="#0f1f3d" stroke-width="1.6" opacity="1"/><text x="470.0" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f1f3d" text-anchor="middle"><tspan x="470.0" dy="0.0">📮 sidecar container</tspan></text><text x="470.0" y="227" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#55637a" text-anchor="middle"><tspan x="470.0" dy="0.0">log-shipper</tspan><tspan x="470.0" dy="16.2">reads /logs</tspan></text>
<path d="M302,240 L348,240" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/><path d="M348,256 L302,256" fill="none" stroke="#1d63ed" stroke-width="2.2" marker-end="url(#ah-blue)"/><rect x="292" y="219" width="65" height="18" fill="#ffffff" opacity="0.92" rx="4"/><text x="325" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1d63ed" text-anchor="middle"><tspan x="325" dy="0.0">localhost</tspan></text>
<rect x="52" y="320" width="546" height="50" rx="10" fill="#ffffff" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="325" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#a85a00" text-anchor="middle"><tspan x="325" dy="0.0">💾 shared volume (emptyDir): both mount /logs</tspan></text>
<text x="325" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle" font-style="italic"><tspan x="325" dy="0.0">scheduled together · started together · deleted together</tspan></text>
<rect x="650" y="70" width="320" height="150" rx="14" fill="#fff6e5" stroke="#f0a23b" stroke-width="1.6" opacity="1"/><text x="810" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#a85a00" text-anchor="middle"><tspan x="810" dy="0.0">🫛 Why “Pod”?</tspan></text>
<text x="810" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f1f3d" text-anchor="middle"><tspan x="810" dy="0.0">Peas grow together in one pod.</tspan><tspan x="810" dy="19.6">Docker's mascot is a whale, and</tspan><tspan x="810" dy="19.6">a group of whales is a pod. 🐳</tspan></text>
<rect x="650" y="235" width="320" height="185" rx="14" fill="#eef4ff" stroke="#1d63ed" stroke-width="1.6" opacity="1"/><text x="810" y="261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b3d91" text-anchor="middle"><tspan x="810" dy="0.0">Rules of thumb</tspan></text>
<text x="668" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f1f3d" text-anchor="start"><tspan x="668" dy="0.0">• smallest thing K8s schedules</tspan><tspan x="668" dy="19.6">• usually 1 main container</tspan><tspan x="668" dy="19.6">  (+ helpers: sidecars, init)</tspan><tspan x="668" dy="19.6">• disposable: replaced,</tspan><tspan x="668" dy="19.6">  never repaired</tspan></text>
</svg>
