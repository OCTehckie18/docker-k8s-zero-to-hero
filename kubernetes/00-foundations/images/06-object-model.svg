<title id="t">Everyday Kubernetes objects</title><desc id="d">Inside a namespace a Deployment manages a ReplicaSet, which manages three Pods; a Service selects the Pods by label; ConfigMaps, Secrets and PVCs feed into Pods. Analogy chips: manager, headcount keeper, worker at a desk, team phone number, instructions and keys.</desc>
