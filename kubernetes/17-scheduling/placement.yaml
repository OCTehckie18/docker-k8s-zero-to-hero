# 1) nodeSelector: only nodes labelled disktype=ssd
apiVersion: v1
kind: Pod
metadata: { name: needs-ssd, labels: { lab: scheduling } }
spec:
  nodeSelector:
    disktype: ssd
  containers: [ { name: c, image: "busybox:1.36", command: ["sleep", "3600"] } ]
---
# 2) Toleration: may run on nodes tainted dedicated=gpu:NoSchedule
apiVersion: v1
kind: Pod
metadata: { name: gpu-job, labels: { lab: scheduling } }
spec:
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  nodeSelector:
    dedicated: gpu
  containers: [ { name: c, image: "busybox:1.36", command: ["sleep", "3600"] } ]
---
# 3) Pod anti-affinity: never two "cache" Pods on the same node (hard rule)
apiVersion: apps/v1
kind: Deployment
metadata: { name: cache, labels: { lab: scheduling } }
spec:
  replicas: 3
  selector: { matchLabels: { app: cache } }
  template:
    metadata: { labels: { app: cache, lab: scheduling } }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app: cache }
      containers: [ { name: c, image: "busybox:1.36", command: ["sleep", "3600"] } ]
