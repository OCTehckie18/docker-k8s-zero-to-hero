apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 4
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      # Spread replicas evenly across nodes, so one node failure doesn't take them all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway    # prefer, don't block (DoNotSchedule = hard rule)
          labelSelector:
            matchLabels: { app: web }
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: 20m, memory: 16Mi }
---
# During voluntary disruptions (node drain, upgrades) keep at least 3 web Pods running.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 3
  selector:
    matchLabels: { app: web }
