# The API takes 20s to boot (STARTUP_DELAY) and depends on Redis for readiness.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      enableServiceLinks: false        # don't inject legacy *_SERVICE_HOST/*_PORT env vars
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: STARTUP_DELAY, value: "20" }
            - { name: REDIS_HOST, value: "redis" }
          ports:
            - containerPort: 8080
          # STARTUP: "has the app finished booting?" Liveness/readiness wait until this passes.
          # Allows up to 30 x 2s = 60s to start.
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
          # LIVENESS: "is the process stuck?" Failing => container is RESTARTED.
          # Must NOT depend on external systems.
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # READINESS: "can I serve traffic right now?" Failing => removed from Service endpoints,
          # NOT restarted. This one MAY check dependencies.
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
