apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
  annotations:
    kubernetes.io/change-cause: "v1.0.0 cats vs dogs"
spec:
  replicas: 4
  revisionHistoryLimit: 5          # old ReplicaSets kept for rollback
  minReadySeconds: 3               # a new Pod must stay Ready this long to count as available
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                  # at most 1 extra Pod above replicas during the update
      maxUnavailable: 0            # never fewer than 4 ready Pods: zero downtime
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: z2h/api:1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: APP_VERSION, value: "1.0.0" }
            - { name: VOTE_OPTIONS, value: "cats:🐱:Cats,dogs:🐶:Dogs" }
          ports:
            - containerPort: 8080
          readinessProbe:          # without readiness, "rolled out" just means "started"
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 2
          lifecycle:
            preStop:               # keep serving a few seconds while the Pod is removed from
              exec:                # Service endpoints everywhere, THEN receive SIGTERM
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
