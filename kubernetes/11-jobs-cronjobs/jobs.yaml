# A one-off task that runs to completion (think: database migration, report).
apiVersion: batch/v1
kind: Job
metadata:
  name: report
spec:
  completions: 5          # run the task 5 times in total
  parallelism: 2          # at most 2 at a time
  backoffLimit: 3         # retry failed Pods up to 3 times
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600    # garbage-collect the Job 10 min after it finishes
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.36
          command: ["sh", "-c", "echo processing batch on $(hostname); sleep 3; echo done"]
---
# A job that fails, to see backoffLimit in action.
apiVersion: batch/v1
kind: Job
metadata:
  name: flaky
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flaky
          image: busybox:1.36
          command: ["sh", "-c", "echo trying...; exit 1"]
---
# Runs every minute.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: heartbeat
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid       # don't start a new run while the previous one is still running
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: heartbeat
              image: busybox:1.36
              command: ["sh", "-c", "date; echo heartbeat ok"]
